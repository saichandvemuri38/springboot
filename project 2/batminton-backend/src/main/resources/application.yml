server:
  port: 9091
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:3306/library
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true

  application:
    name: BATMINTON-SERVICE
  config:
    import: configserver:${CONFIG_SERVER_URL:http://localhost:9296}