apiVersion: apps/v1
kind: Deployment
metadata:
  name: billingservice
spec:
  selector:
    matchLabels:
      app: billingservice
  template:
    metadata:
      labels:
        app: billingservice
    spec:
      containers:
      - name: billingservice
        image: saichandvemuri/billingservice
        ports:
        - containerPort: 8084
        env:
          - name: EUREKA_SERVER_ADDRESS
            valueFrom:
              configMapKeyRef:
                key: eureka_service_address
                name: eureka-cm
          - name: CONFIG_SERVER_URL
            valueFrom:
              configMapKeyRef:
                key: config-url
                name: config-cm
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                key: hostname
                name: mysql-cm

---

apiVersion: v1
kind: Service
metadata:
  name: billingservice-svc
spec:
  selector:
    app: billingservice
  ports:
  - port: 80
    targetPort: 8084