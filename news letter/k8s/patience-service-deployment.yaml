apiVersion: apps/v1
kind: Deployment
metadata:
  name: patienceservice
spec:
  selector:
    matchLabels:
      app: patienceservice
  template:
    metadata:
      labels:
        app: patienceservice
    spec:
      containers:
      - name: patienceservice
        image: saichandvemuri/patienceservice
        ports:
        - containerPort: 8083
        env:
          - name: EUREKA_SERVER_ADDRESS
            valueFrom:
              configMapKeyRef:
                key: eureka_service_address
                name: eureka-cm
          - name: CONFIG_SERVER_URL
            valueFrom:
              configMapKeyRef:
                key: config-url
                name: config-cm
          - name: DB_HOST
            valueFrom:
              configMapKeyRef:
                key: hostname
                name: mysql-cm

---

apiVersion: v1
kind: Service
metadata:
  name: patienceservice-svc
spec:
  selector:
    app: patienceservice
  ports:
  - port: 80
    targetPort: 8083